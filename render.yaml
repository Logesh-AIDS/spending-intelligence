services:
  - type: web
    name: spending-intelligence-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn Main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spending-intelligence-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ML_MODELS_DIR
        value: /app/ml/models
      - key: ML_DATA_DIR
        value: /app/ml/data

databases:
  - name: spending-intelligence-db
    databaseName: spending_db
    user: spending_user
    plan: free
